<!DOCTYPE html>
<!-- Implements FR-050, FR-062, FR-063, FR-064, AD-10, AD-15. See prd.md §4.6 and ARCHITECTURE-SPINE.md AD-10 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discussion — TBD</title>
<style>
/* Spine: DESIGN.md Brand & Style, Colors, Components. EXPERIENCE.md IA + states. min-height not height. */

:root {
  --sand:#F4EDE0; --raised:#FFFBF4; --indigo:#1F3A5F; --deep:#15283F;
  --gold:#C4A35A; --goldsoft:#E8D5A3; --ink:#1B2433; --muted:#5C5346;
  --onind:#F4EDE0; --border:#6F624C; --hair:#D9CDB8; --blur:#C8BBA6; --staff:#6B3D2E;
  --danger:#8B3A3A; --focus:#1F3A5F;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Source Sans 3", system-ui, sans-serif;
  background: #cfc3ad;
  color: var(--ink);
  padding: 24px;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.frame {
  width: 360px;
  min-height: 720px;
  margin: 0 auto;
  background: var(--sand);
  border-radius: 28px;
  overflow: hidden;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.wide { width: 880px; min-height: 560px; }
.top { background: var(--deep); color: var(--onind); padding: 18px 16px 14px; }
.top h1 { font-family: Georgia, "Source Serif 4", serif; font-size: 20px; margin: 0 0 4px; font-weight: 600; }
.top p { margin: 0; font-size: 12px; opacity: .85; }
.pad { padding: 16px; flex: 1; }
label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; font-weight: 500; }
input, select, textarea {
  width: 100%; min-height: 48px; border: 1px solid var(--border);
  border-radius: 12px; padding: 8px 12px; background: var(--raised);
  font-size: 16px; font-family: inherit;
}
textarea { min-height: 88px; }
.btn { min-height: 48px; border: 0; border-radius: 12px; width: 100%; font-weight: 600; font-size: 16px; padding: 8px 12px; }
.btn-p { background: var(--indigo); color: var(--onind); }
.btn-p:focus-visible { outline-color: #E8D5A3; }
.btn-s { background: var(--raised); color: var(--indigo); border: 1px solid var(--border); }
.btn-q { background: transparent; color: var(--muted); min-height: 44px; border: 0; width: 100%; }
.nav {
  display: flex; border-top: 1px solid var(--hair); background: var(--raised);
  min-height: 64px;
}
.nav a { flex: 1; text-align: center; font-size: 11px; padding-top: 10px; color: var(--muted); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--indigo); font-weight: 600; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 8px; color: inherit; text-decoration: none; display: block; }
.blur {
  height: 88px; background: var(--blur); border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--deep); font-size: 14px; font-weight: 600;
}
.meta { font-size: 16px; color: var(--ink); margin: 6px 0 0; line-height: 1.35; }
.sub { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
.chip { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; background: var(--goldsoft); color: var(--deep); border-radius: 12px; padding: 8px 12px; font-size: 14px; font-weight: 600; border: 0; }
.badge { display: inline-block; background: var(--staff); color: var(--raised); border-radius: 6px; padding: 2px 8px; font-size: 11px; letter-spacing: .02em; }
.bubble { max-width: 78%; border-radius: 20px; padding: 10px 12px; margin: 8px 0; font-size: 15px; }
.mine { background: var(--indigo); color: var(--onind); margin-left: auto; border-bottom-right-radius: 6px; }
.theirs { background: var(--raised); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
.time { font-size: 11px; color: var(--muted); text-align: right; }
.banner { background: var(--deep); color: var(--onind); padding: 8px 12px; font-size: 13px; }
.row { background: var(--raised); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; }
.pack { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: var(--raised); margin-bottom: 10px; width: 100%; text-align: left; font: inherit; color: inherit; }
.pack.on { background: var(--goldsoft); box-shadow: 0 0 0 2px var(--indigo); }
.note { font-size: 13px; color: var(--muted); }
.audio { display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; }
.audio button { min-height: 44px; min-width: 44px; border: 1px solid var(--border); border-radius: 12px; background: var(--raised); color: var(--deep); font-weight: 600; }

</style>
</head>
<body>
<div class="frame">

<div class="top">
  <h1>Ibrahim</h1>
  <p><span class="chip" style="min-height:auto;padding:2px 8px;display:inline-block">étape chat</span> · Un wali lit cette discussion</p>
</div>
<div class="pad">
  <div class="bubble theirs">As-salāmu ʿalaykum. Je cherche le mariage avec honnêteté. J’ai déjà une épouse.</div>
  <p class="time">20:12 · arrivé</p>
  <div class="bubble mine">Wa ʿalaykum as-salām. Mon père lira nos messages.</div>
  <p class="time">20:13 · arrivé</p>
  <div class="bubble theirs">Note vocale · 0:12 ▶</div>
  <p class="time">20:14 · arrivé</p>
  <div aria-live="polite" class="note">Message envoyé</div>
</div>
<div style="padding:12px;border-top:1px solid var(--hair);background:var(--raised)">
  <label for="msg">Message</label>
  <input id="msg" placeholder="Écrire un message…">
  <button class="btn btn-p" style="margin-top:8px">Envoyer</button>
</div>

</div>
</body>
</html>
