name: ankanu

services:
  web:
    image: web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/").then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  api:
    image: api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/main.js"]
    environment:
      DATABASE_URL: postgres://ankanu@postgres:5432/ankanu
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: http://bucket:9000
      S3_BUCKET: ankanu
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      EVIDENCE_KEY: "${EVIDENCE_KEY}"
      EVIDENCE_KID: "${EVIDENCE_KID}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bucket:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/v1/health").then(async (response) => { const body = await response.json(); process.exit(response.ok && body.status === "ok" && body.role === "api" && typeof body.request_id === "string" ? 0 : 1); }).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

  worker:
    image: api
    pull_policy: never
    command: ["sh", "-c", "PROCESS_ROLE=worker exec node apps/api/dist/main.js"]
    environment:
      PROCESS_ROLE: worker
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'const fs=require("fs"); if(process.env.PROCESS_ROLE!=="worker") process.exit(1); const read=(path)=>{try{return fs.readFileSync(path,"utf8")}catch{return ""}}; const rows=read("/proc/net/tcp").trim().split("\n").slice(1).concat(read("/proc/net/tcp6").trim().split("\n").slice(1)); const open=rows.filter((line)=>{ const cols=line.trim().split(/\s+/); if(cols[3]!=="0A") return false; const addr=(cols[1]||"").split(":")[0]; return addr!=="0B00007F"; }); if(open.length) process.exit(1);'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ankanu
      POSTGRES_DB: ankanu
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/lib/postgresql/wal-archive /var/lib/postgresql/basebackups
        chown postgres:postgres /var/lib/postgresql/wal-archive /var/lib/postgresql/basebackups
        exec docker-entrypoint.sh postgres -c wal_level=replica -c archive_mode=on -c archive_timeout=60 -c archive_command='if [ -f /var/lib/postgresql/wal-archive/%f ]; then exit 0; fi; cp %p /var/lib/postgresql/wal-archive/%f.tmp && mv /var/lib/postgresql/wal-archive/%f.tmp /var/lib/postgresql/wal-archive/%f'
    volumes:
      - ./pg-data:/var/lib/postgresql/data
      - ./pg-wal:/var/lib/postgresql/wal-archive
      - ./pg-base:/var/lib/postgresql/basebackups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ankanu", "-d", "ankanu"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.6.3
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  bucket:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'case "$$MINIO_ROOT_USER" in *[![:space:]]*) ;; *) exit 1 ;; esac; case "$$MINIO_ROOT_PASSWORD" in *[![:space:]]*) ;; *) exit 1 ;; esac; exec minio server /data'
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY_ID}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_ACCESS_KEY}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
