<!-- Script for OTP Focus Shifting & Countdown -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('.otp-digit');
      
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = val;
          if (val && index < inputs.length - 1) {
            inputs[index + 1].focus();
          }
        });

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim();
          const numericData = pasteData.replace(/[^0-9]/g, '').slice(0, inputs.length);
          
          numericData.split('').forEach((char, i) => {
            if (inputs[i]) {
              inputs[i].value = char;
            }
          });

          const nextIndex = Math.min(numericData.length, inputs.length - 1);
          inputs[nextIndex].focus();
        });
      });

      // Simple Cooldown Timer Simulation
      let secondsLeft = 45;
      const timerSpan = document.getElementById('timer-count');
      const resendBtn = document.getElementById('resend-btn');

      const interval = setInterval(() => {
        secondsLeft--;
        if (secondsLeft <= 0) {
          clearInterval(interval);
          resendBtn.disabled = false;
          resendBtn.classList.remove('cursor-not-allowed', 'opacity-80');
          resendBtn.textContent = 'Renvoyer le code';
        } else {
          const secStr = secondsLeft < 10 ? '0' + secondsLeft : secondsLeft;
          timerSpan.textContent = `0:${secStr}`;
        }
      }, 1000);
    });
  </script>
