services:
  web:
    image: web:qa
    pull_policy: never
    ports: ["4021:3000"]
  api:
    image: api:qa2
    pull_policy: never
    ports: ["4022:3000"]
    environment:
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - <scratch>/qa/certs:/certs:ro
  worker:
    image: api:qa2
    pull_policy: never
  sms-stub:
    image: api:qa2
    pull_policy: never
    command: ["node", "/stub/aqilas-stub.mjs"]
    volumes:
      - <scratch>/qa/aqilas-stub.mjs:/stub/aqilas-stub.mjs:ro
    ports: ["4023:8099"]
  google-stub:
    image: api:qa2
    pull_policy: never
    command: ["node", "/stub/google-stub.mjs"]
    volumes:
      - <scratch>/qa/google-stub.mjs:/stub/google-stub.mjs:ro
      - <scratch>/qa/certs:/certs:ro
    networks:
      default:
        aliases: [www.google.com]
