name: ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  oxlint:
    name: oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run lint
  types:
    name: types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run typecheck
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run test:unit
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run test:integration
  migration-check:
    name: migration check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npm run migration-check
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            code/e2e/.report
            code/e2e/.results
          retention-days: 14
