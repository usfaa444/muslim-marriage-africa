<body class="bg-cream text-deep-navy font-body min-h-full flex flex-col antialiased selection:bg-soft-gold/30 selection:text-deep-navy">
<!-- Sticky Header -->
<header class="w-full top-0 sticky z-50 bg-cream border-b border-hairline/60">

<!-- Main Canvas: Centered PIN Lock Screen -->
<main class="flex-1 flex items-center justify-center px-4 py-12 md:py-16">
<div class="w-full max-w-[580px] bg-cream border border-hairline rounded-md p-8 md:p-12 flex flex-col items-center text-center" style="background-color: rgb(251, 248, 241);">
<!-- Security Icon Badge -->

<span class="material-symbols-outlined text-3xl" data-icon="lock">lock</span>
</div>
<!-- Headline & Subtitle -->
<h1 class="font-display text-3xl md:text-4xl text-deep-navy font-normal mb-3 tracking-tight">
        Code d'accès confidentiel
      </h1>
<p class="text-sm leading-relaxed text-deep-navy/75 max-w-md mx-auto mb-8 font-normal">
        Saisissez votre code PIN pour accéder à votre espace noble et préserver la confidentialité de vos échanges.
      </p>
<!-- PIN Discrete Indicators (6 digits) -->
<div class="flex items-center justify-center gap-3 md:gap-4 mb-8" id="pin-display">
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="0">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="1">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="2">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="3">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="4">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
<div class="pin-slot w-11 h-13 md:w-12 md:h-14 rounded-md border-2 border-hairline bg-cream flex items-center justify-center transition-all duration-150" data-index="5">
<div class="w-3 h-3 rounded-full bg-deep-navy opacity-0 transition-opacity duration-150 pin-dot"></div>
</div>
</div>
<!-- Numeric Keypad Layout -->
<div class="grid grid-cols-3 gap-3 md:gap-4 w-full max-w-[320px] mb-8">
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="1" type="button">1</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="2" type="button">2</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="3" type="button">3</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="4" type="button">4</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="5" type="button">5</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="6" type="button">6</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="7" type="button">7</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="8" type="button">8</button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="9" type="button">9</button>
<!-- Clear Action -->
<button class="h-14 rounded-md border border-transparent hover:border-hairline text-xs font-medium text-deep-navy/60 hover:text-deep-navy transition-all duration-150 flex items-center justify-center focus:outline-none" id="btn-clear" type="button">
          Effacer
        </button>
<button class="num-key h-14 rounded-md border border-hairline/80 bg-cream hover:border-soft-gold hover:text-deep-navy active:bg-hairline/30 text-lg font-medium text-deep-navy transition-all duration-150 focus:outline-none focus:ring-1 focus:ring-soft-gold" data-key="0" type="button">0</button>
<!-- Backspace Action -->
<button aria-label="Supprimer un chiffre" class="h-14 rounded-md border border-transparent hover:border-hairline text-deep-navy/70 hover:text-deep-navy transition-all duration-150 flex items-center justify-center focus:outline-none" id="btn-backspace" type="button">
<span class="material-symbols-outlined text-xl" data-icon="backspace">backspace</span>
</button>
</div>
<!-- Action Button -->
<div class="w-full max-w-[320px] space-y-4">
<button class="w-full h-12 bg-deep-navy hover:bg-deep-navy/90 text-cream rounded-md font-medium text-sm flex items-center justify-center gap-2 transition-all duration-150 active:opacity-90" id="btn-submit" type="button">
<span class="">Déverrouiller l'espace</span>
<span class="material-symbols-outlined text-base" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary subtle recovery link -->
<div class="pt-2">
<a class="text-xs text-deep-navy/70 hover:text-soft-gold transition-colors duration-200 underline underline-offset-4 decoration-hairline" href="#">
            Code oublié ?
          </a>
<span class="text-hairline mx-2">•</span>
<a class="text-xs text-deep-navy/70 hover:text-soft-gold transition-colors duration-200 underline underline-offset-4 decoration-hairline" href="#">
            S'identifier à nouveau
          </a>
</div>
</div>
<!-- Micro Status Hint -->
<div class="mt-6 text-xs text-deep-navy/50 flex items-center gap-1.5" id="status-hint">
<span class="material-symbols-outlined text-sm text-soft-gold" data-icon="verified_user">verified_user</span>

</div>
</div>
</main>
<!-- Shared Footer -->
<footer class="w-full border-t border-hairline/60 bg-cream mt-auto">

</footer>
<!-- Micro-interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      let currentPin = '';
      const maxDigits = 6;
      const slots = document.querySelectorAll('.pin-slot');
      const dots = document.querySelectorAll('.pin-dot');

      function updateDisplay() {
        slots.forEach((slot, index) => {
          const dot = dots[index];
          if (index < currentPin.length) {
            dot.classList.remove('opacity-0');
            slot.classList.add('border-soft-gold');
            slot.classList.remove('border-hairline');
          } else {
            dot.classList.add('opacity-0');
            slot.classList.remove('border-soft-gold');
            slot.classList.add('border-hairline');
          }
        });
      }

      function addDigit(digit) {
        if (currentPin.length < maxDigits) {
          currentPin += digit;
          updateDisplay();
        }
      }

      function removeDigit() {
        if (currentPin.length > 0) {
          currentPin = currentPin.slice(0, -1);
          updateDisplay();
        }
      }

      function clearPin() {
        currentPin = '';
        updateDisplay();
      }

      document.querySelectorAll('.num-key').forEach(button => {
        button.addEventListener('click', () => {
          const key = button.getAttribute('data-key');
          addDigit(key);
        });
      });

      document.getElementById('btn-backspace').addEventListener('click', () => {
        removeDigit();
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        clearPin();
      });

      // Keyboard support
      window.addEventListener('keydown', (e) => {
        if (/^[0-9]$/.test(e.key)) {
          addDigit(e.key);
        } else if (e.key === 'Backspace') {
          removeDigit();
        } else if (e.key === 'Escape') {
          clearPin();
        }
      });

      document.getElementById('btn-submit').addEventListener('click', () => {
        if (currentPin.length >= 4) {
          const hint = document.getElementById('status-hint');
          hint.innerHTML = '<span class="material-symbols-outlined text-sm text-soft-gold" data-icon="lock_open">lock_open</span><span>Validation du code en cours...</span>';
          setTimeout(() => {
            hint.innerHTML = '<span class="material-symbols-outlined text-sm text-soft-gold" data-icon="verified_user">verified_user</span><span>Chiffrement et vérification locale sécurisée</span>';
          }, 1200);
        }
      });
    });
  </script>






</body></html>
